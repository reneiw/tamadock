
networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}
volumes:
  mysql:
    driver: ${VOLUMES_DRIVER}
  redis:
    driver: ${VOLUMES_DRIVER}
  postgres:
    driver: ${VOLUMES_DRIVER}
  opensearch:
    driver: ${VOLUMES_DRIVER}
  mongo:
    driver: ${VOLUMES_DRIVER}
  caddy:
    driver: ${VOLUMES_DRIVER}
services:

  ### Workspace Utilities ##################################
  workspace:
    build:
      context: ./workspace
      args:
        - DEBIAN_VERSION=${DEBIAN_VERSION}
        - PHP_VERSION=${PHP_VERSION}
        - INSTALL_GRPC=${WORKSPACE_INSTALL_GRPC}
        - INSTALL_PROTOBUF=${WORKSPACE_INSTALL_PROTOBUF}
        - INSTALL_RDKAFKA=${WORKSPACE_INSTALL_RDKAFKA}
        - INSTALL_XLS_WRITER=${WORKSPACE_INSTALL_XLS_WRITER}
        - INSTALL_AHOCORASICK=${WORKSPACE_INSTALL_AHOCORASICK}
        - INSTALL_SWOOLE=${WORKSPACE_INSTALL_SWOOLE}
        - INSTALL_NODE=${WORKSPACE_INSTALL_NODE}
        - NODE_VERSION=${WORKSPACE_NODE_VERSION}
        - PUID=${WORKSPACE_PUID}
        - PGID=${WORKSPACE_PGID}
        - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    tty: true
    environment:
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
    ports:
      - "6001:6001"
      - "6666:6666"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ### PHP-FPM ##############################################
  php-fpm:
    build:
      context: ./php-fpm
      args:
        - DEBIAN_VERSION=${DEBIAN_VERSION}
        - PHP_VERSION=${PHP_VERSION}
        - INSTALL_GRPC=${PHP_FPM_INSTALL_GRPC}
        - INSTALL_PROTOBUF=${PHP_FPM_INSTALL_PROTOBUF}
        - INSTALL_RDKAFKA=${PHP_FPM_INSTALL_RDKAFKA}
        - INSTALL_SWOOLE=${PHP_FPM_INSTALL_SWOOLE}
        - INSTALL_XDEBUG=${PHP_FPM_INSTALL_XDEBUG}
        - INSTALL_XLS_WRITER=${PHP_FPM_INSTALL_XLS_WRITER}
        - INSTALL_AHOCORASICK=${PHP_FPM_INSTALL_AHOCORASICK}
        - INSTALL_XHPROF=${PHP_FPM_INSTALL_XHPROF}
        - INSTALL_MONGO=${PHP_FPM_INSTALL_MONGO}
        - PUID=${PHP_FPM_PUID}
        - PGID=${PHP_FPM_PGID}
        - LOCALE=${PHP_FPM_DEFAULT_LOCALE}
    volumes:
      - ./php-fpm/php${PHP_VERSION}.ini:/usr/local/etc/php/php.ini
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${PHP_FPM_HOST_LOG_PATH}:/var/log/php-fpm
    ports:
      - "${PHP_FPM_XDEBUG_PORT}:9003"
    expose:
      - "9000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    environment:
      - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
    depends_on:
      workspace:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ### PHP Worker ###########################################
  php-worker:
    build:
      context: ./php-worker
      args:
        - DEBIAN_VERSION=${DEBIAN_VERSION}
        - PHP_VERSION=${PHP_VERSION}
        - INSTALL_GRPC=${PHP_WORKER_INSTALL_GRPC}
        - INSTALL_PROTOBUF=${PHP_WORKER_INSTALL_PROTOBUF}
        - INSTALL_RDKAFKA=${PHP_WORKER_INSTALL_RDKAFKA}
        - INSTALL_SWOOLE=${PHP_WORKER_INSTALL_SWOOLE}
        - INSTALL_XLS_WRITER=${PHP_WORKER_INSTALL_XLS_WRITER}
        - INSTALL_AHOCORASICK=${PHP_WORKER_INSTALL_AHOCORASICK}
        - PUID=${PHP_WORKER_PUID}
        - PGID=${PHP_WORKER_PGID}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ./php-worker/supervisord.d:/etc/supervisord.d
      - ./logs/php-worker:/var/log/supervisor
    depends_on:
      workspace:
        condition: service_healthy
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      - backend

  ### Hyperf Server ########################################
  hyperf:
    build:
      context: ./hyperf
      args:
        - HYPERF_VERSION=${HYPERF_VERSION}
        - INSTALL_RDKAFKA=${HYPERF_INSTALL_RDKAFKA}
        - INSTALL_GRPC=${HYPERF_INSTALL_GRPC}
        - INSTALL_PROTOBUF=${HYPERF_INSTALL_PROTOBUF}
        - INSTALL_XLS_WRITER=${HYPERF_INSTALL_XLS_WRITER}
        - INSTALL_AHOCORASICK=${HYPERF_INSTALL_AHOCORASICK}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
    working_dir: ${APP_CODE_PATH_CONTAINER}
    environment:
      - HYPERF_APP_PATH=${HYPERF_APP_PATH}
      - HYPERF_START_COMMAND=${HYPERF_START_COMMAND}
    ports:
      - "${HYPERF_HOST_HTTP_PORT}:9501"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend

  ### NGINX Server #########################################
  nginx:
    build:
      context: ./nginx
      args:
        - PHP_UPSTREAM_CONTAINER=${NGINX_PHP_UPSTREAM_CONTAINER}
        - PHP_UPSTREAM_PORT=${NGINX_PHP_UPSTREAM_PORT}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
      - ${NGINX_SITES_PATH}:/etc/nginx/sites-available
      - ${NGINX_SSL_PATH}:/etc/nginx/ssl
      - ${NGINX_LUA_PATH}:/etc/nginx/lua
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"
      - "${NGINX_HOST_HTTPS_PORT}:443"
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - frontend
      - backend


  ### MySQL ################################################
  mysql:
    build:
      context: ./mysql
      args:
        - MYSQL_VERSION=${MYSQL_VERSION}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_HOST="%"
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${WORKSPACE_TIMEZONE}
    volumes:
      - ${DATA_PATH_HOST}/mysql:/var/lib/mysql
      - ${MYSQL_ENTRYPOINT_INIT_DB}:/docker-entrypoint-init-db.d
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend
    platform: ${MYSQL_PLATFORM}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ### Redis ################################################
  redis:
    build:
      context: ./redis
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/redis:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    command: --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD ping | grep PONG >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  mailhog:
    build: ./mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontend
      - backend

  ### OpenSearch ###########################################
  opensearch:
    build:
      context: ./elasticsearch
      args:
        - OPENSEARCH_VERSION=${OPENSEARCH_VERSION}
    volumes:
      - opensearch:/usr/share/opensearch/data
      - ${OPENSEARCH_CONFIG_PATH}/analysis:/usr/share/opensearch/config/analysis
    environment:
      - discovery.type=single-node
      # 单节点开发环境不创建副本，避免新索引因副本无法分配而变黄
      - cluster.default_number_of_replicas=0
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2048m -Xmx2048m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_HOST_HTTP_PORT}:9200"
      - "${OPENSEARCH_HOST_TRANSPORT_PORT}:9300"
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || wget -q -O- http://127.0.0.1:9200 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
  ### RabbitMQ #############################################
  rabbitmq:
    build: ./rabbitmq
    ports:
      - "${RABBITMQ_NODE_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HTTP_HOST_PORT}:15672"
      - "${RABBITMQ_MANAGEMENT_HTTPS_HOST_PORT}:15671"
      - "${RABBITMQ_WEB_STOMP_HOST_PORT}:15674"
    hostname: rabbitmq
    volumes:
      - ${DATA_PATH_HOST}/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/management_agent.disable_metrics_collector.conf:/etc/rabbitmq/conf.d/management_agent.disable_metrics_collector.conf
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ### MongoDB ##############################################
  mongo:
    build: ./mongo
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ${DATA_PATH_HOST}/mongo:/data/db
      - ${DATA_PATH_HOST}/mongo_config:/data/configdb
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ### PostgreSQL ############################################
  postgres:
    build:
      context: ./postgres
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/postgres:/var/lib/postgresql
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${WORKSPACE_TIMEZONE}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ### Minio ################################################
  minio:
    build: ./minio
    volumes:
      - ${DATA_PATH_HOST}/minio/data:/export
      - ${DATA_PATH_HOST}/minio/config:/root/.minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - frontend
      - backend

  ### OpenSearch Dashboards ###############################
  opensearch-dashboards:
    build:
      context: ./kibana
      args:
        - OPENSEARCH_VERSION=${OPENSEARCH_VERSION}
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "${OPENSEARCH_DASHBOARDS_HTTP_PORT}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - frontend
      - backend

  ### Caddy Server #########################################
  caddy:
    restart: always
    profiles:
      - caddy
    build: ./caddy
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${CADDY_CONFIG_PATH}:/etc/caddy
      - ${CADDY_HOST_LOG_PATH}:/var/log/caddy
      - ${DATA_PATH_HOST}:/root/.caddy
    ports:
      - "${CADDY_HOST_HTTP_PORT}:80"
      - "${CADDY_HOST_HTTPS_PORT}:443"
      - "10080:10080"
    environment:
      - CF_API_TOKEN=${CADDY_CF_API_TOKEN}
      - EMAIL=${CADDY_CF_DNS_EMAIL}
    dns:
      - 1.1.1.1
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - frontend
      - backend
