[global]
error_log = /var/log/php-fpm/laravel.log
log_level = notice
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = static
pm.max_children = 1
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes

; Keep PHP errors separate from FPM lifecycle and request access logs.
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL
php_admin_value[error_log] = /var/log/php-fpm/error_log

; Detailed per-request log: client, host, route, script, status, timing, memory and CPU.
access.log = /var/log/php-fpm/access.log
access.format = "%{%Y-%m-%dT%H:%M:%S%z}t remote=%R host=\"%{HTTP_HOST}e\" method=%m uri=\"%r\" status=%s script=\"%f\" duration_ms=%{milliseconds}d memory_kb=%{kilobytes}M cpu_total=%{total}C%% request_bytes=%l user=\"%u\" ua=\"%{HTTP_USER_AGENT}e\" request_id=\"%{HTTP_X_REQUEST_ID}e\""

; Enable useful PHP stack traces for slow requests in the development container.
process.dumpable = yes
slowlog = /var/log/php-fpm/slow.log
request_slowlog_timeout = 5s
request_slowlog_trace_depth = 50